# Cluster settings. Everything left empty ("") is AUTO-DETECTED (sinfo at submit time, the allocation at run time).
# Usually you only need to check ACCOUNT and MODULES.

ACCOUNT=""                 # sbatch --account   (empty = your default account)
QOS=""                     # sbatch --qos       (empty = default)
GPU_PARTITION=""           # empty = first partition whose GRES mentions h100
CPU_PARTITION=""           # empty = run the CPU stages on GPU_PARTITION as well
CPU_STAGE_GPUS="0"         # set 1 if your GPU partition refuses jobs without a GPU
GPUS=""                    # GPUs per GPU job; empty = all H100s of one node, capped at 4 (shorter queue)
CPU_CPUS=""                # CPUs for CPU stages; empty = min(64, CPUs per node)

# Python environment (created once on the login node by setup_env.sh)
MODULES=""                 # e.g. "module load python/3.11 cuda/12.4"  (empty = none)
VENV="$HOME/ber_venv"
ACTIVATE="source $VENV/bin/activate"

# Paths (defaults: layout of this repository)
_ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/../../.." && pwd)"
BER_DATA_DIR="$_ROOT/student_resource/dataset"
BER_WORK_DIR="$_ROOT/work"          # ~60 GB scratch; put it on fast scratch storage if you have one
BER_OUT_DIR="$_ROOT/submission/output"
HF_HOME="$_ROOT/hf_cache"           # models are downloaded here by setup_env.sh (compute nodes may be offline)

# Models (MIT licence, <= 8B params)
BER_DENSE_MODEL="intfloat/multilingual-e5-small"
BER_XENC_MODEL="intfloat/multilingual-e5-base"
BER_LLM_MODEL="Qwen/Qwen2.5-1.5B"          # Apache-2.0 (0.5B / 1.5B / 7B are Apache; 3B is NOT)
LLM_P_LO="0.02"                            # LLM judge only scores the uncertain band of stage-1 p
LLM_P_HI="0.98"

# Optional overrides (empty = auto from RAM / GPU memory, see env.sh)
BER_N_TRAIN_S1=""
BER_N_VAL_S1=""

# Wall-clock limits per stage
TIME_PREP="01:00:00"
TIME_CAND="06:00:00"
TIME_DENSE="03:00:00"
TIME_FEAT="10:00:00"
TIME_XENC="06:00:00"
TIME_LLM="08:00:00"
TIME_STAGE2="03:00:00"
